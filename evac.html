<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadyLaPlata — Incident information</title></head>
<body><p>Incident information is now available on the <a id="homeLink" href="index.html">ReadyLaPlata home map</a>.</p>
<script>const target=new URL('index.html',location.href);const incident=new URLSearchParams(location.search).get('incident');if(incident)target.searchParams.set('incident',incident);document.getElementById('homeLink').href=target.href;location.replace(target.href);</script>
</body></html>
